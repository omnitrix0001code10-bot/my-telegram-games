  const renderSettings=()=>(
    <div className="page-enter relative z-10 min-h-screen pb-20"><TopBar title={t.settings} icon="⚙"/>
      <div className="max-w-3xl mx-auto px-4 sm:px-6 pt-9">
        <div className="lux-panel rounded-[28px] p-6 sm:p-8 space-y-7">
          <SettingToggle title={t.music} desc={t.musicVol} on={settings.music} setOn={()=>setSettings(s=>({...s,music:!s.music}))} slider value={settings.musicVol} onChange={v=>setSettings(s=>({...s,musicVol:v}))}/>
          <SettingToggle title={t.uiSound} desc={t.uiVol} on={settings.sfx} setOn={()=>setSettings(s=>({...s,sfx:!s.sfx}))} slider value={settings.uiVol} onChange={v=>setSettings(s=>({...s,uiVol:v}))}/>
          <SettingToggle title={t.gameSound} desc={t.gameVol} on={settings.game} setOn={()=>setSettings(s=>({...s,game:!s.game}))} slider value={settings.gameVol} onChange={v=>setSettings(s=>({...s,gameVol:v}))}/>
          <div className="pt-4 border-t border-white/8"><div className="text-xs uppercase tracking-[.25em] text-slate-500">{t.language}</div><div className="flex gap-2 mt-4"><button onClick={()=>setLang("ru")} className={`lux-btn rounded-xl px-4 py-2 text-xs font-bold ${lang==="ru"?"neon":""}`}>{t.russian}</button><button onClick={()=>setLang("en")} className={`lux-btn rounded-xl px-4 py-2 text-xs font-bold ${lang==="en"?"neon":""}`}>{t.english}</button></div></div>
          <div className="pt-4 border-t border-white/8 text-xs text-slate-500 leading-relaxed">Asset folders: <span className="font-mono text-slate-300">assets/cards/</span> and <span className="font-mono text-slate-300">assets/audio/cards/</span>. Alien X ability sounds: <span className="font-mono text-slate-300">assets/audio/alienx/</span>.</div>
        </div>
      </div>
    </div>
  );
  function SettingToggle({title,desc,on,setOn,slider,value,onChange}){return <div className="flex items-center justify-between gap-5 pb-6 border-b border-white/8 last:border-0 last:pb-0"><div><div className="font-bold text-sm">{title}</div><div className="text-xs text-slate-500 mt-1">{desc}</div>{slider&&<input aria-label={title} type="range" min="0" max="1" step=".01" value={value} onChange={e=>onChange(Number(e.target.value))} className="w-52 mt-3 accent-emerald-400"/>}</div><button className={`toggle ${on?"on":""}`} onClick={setOn}><i/></button></div>}

  function CombatStatPanel({side,card,hp,maxHp,energy,t}){
    const enemy=side==="enemy";
    const hpPct=Math.max(0,Math.min(100,(Number(hp)||0)/Math.max(1,Number(maxHp)||1)*100));
    const ePct=Math.max(0,Math.min(100,Number(energy)||0));
    const accent=enemy?"red":"emerald";
    const label=enemy?(game?.opponentName||"ENEMY"):"YOU";
    return <div className={`combat-stat-panel ${enemy?"enemy":"player"}`}>
      <div className="combat-stat-head">
        <div className="combat-side-mark"><span className="combat-dot"/>{label}</div>
        <div className="combat-mini-rank">{card?.category||"—"}</div>
      </div>
      <div className="combat-bars">
        <div className="combat-bar-row">
          <div className="combat-bar-label"><span>HP</span><b>{Math.round(hp||0)} <i>/ {Math.round(maxHp||0)}</i></b></div>
          <div className="combat-bar-track hp"><div className={`combat-bar-fill ${accent}`} style={{width:`${hpPct}%`}}/></div>
        </div>
        <div className="combat-bar-row">
          <div className="combat-bar-label"><span>{t.energy}</span><b>{Math.round(energy||0)}<i>%</i></b></div>
          <div className="combat-bar-track energy"><div className={`combat-bar-fill ${enemy?"violet":"cyan"}`} style={{width:`${ePct}%`}}/><div className="combat-energy-glow"/></div>
        </div>
      </div>
      <div className="combat-metrics">
        <div><small>DEF</small><strong>{card?.def??"—"}</strong></div>
        <div><small>SPD</small><strong>{card?.spd??"—"}</strong></div>
        <div><small>ENERGY</small><strong>{Math.round(energy||0)}%</strong></div>
      </div>
    </div>
  }

  const renderBattle=()=>{
    if(!game)return null;
    const p=game.selectedCharCard;
    const o=game.opponentCharCard;
    const abilities=p?.abilities||[];
    const result=game.clashResult;
    const over=game.stage==="GAME_OVER";
    const winner=game.forcedWinner || (over?(game.playerScore>game.opponentScore?"PLAYER":game.playerScore<game.opponentScore?"OPPONENT":null):null);
    const bossMode=game.battleMode==="raid";
    return <div className="page-enter relative z-10 min-h-screen battle-bg overflow-hidden">
      <div className="relative z-10 flex items-center justify-between gap-3 px-3 sm:px-5 py-3 border-b border-white/7 bg-black/30 backdrop-blur-xl">
        <div className="flex items-center gap-2"><button onClick={doPause} className="lux-btn rounded-xl p-2.5" title={t.pause}>Ⅱ</button><button onClick={leaveMatch} className="lux-btn rounded-xl p-2.5 text-red-300" title={t.exit}>×</button><div className="hidden sm:block font-cinzel tracking-widest text-sm ml-2">{t.title}</div></div>
        <div className="flex items-center gap-6"><div className="text-center"><div className="text-[8px] uppercase tracking-widest text-slate-500">YOU</div><div className="font-cinzel text-lg">{game.playerScore}</div></div><div className="font-cinzel text-xs sm:text-sm tracking-widest text-yellow-400 px-3 py-1.5 rounded-lg bg-yellow-500/10 border border-yellow-500/20">{t.round} {game.round}</div><div className="text-center"><div className="text-[8px] uppercase tracking-widest text-slate-500">{bossMode?(game.creatorBoss?"CREATOR":"BOSS"):(game.opponentName||"ENEMY")}</div><div className="font-cinzel text-lg">{game.opponentScore}</div></div></div>
        <div className="text-[9px] uppercase tracking-widest text-slate-500 hidden sm:block">{game.battleMode.toUpperCase()}</div>
      </div>

      {bossMode&&game.raidHost&&<div className="relative z-10 max-w-6xl mx-auto px-4 pt-3 text-[9px] uppercase tracking-widest text-slate-500">RAID: {1+(game.raidMembers?.length||0)} / 4 players connected</div>}

      <div className="relative z-10 max-w-7xl mx-auto p-4 sm:p-7">
        <div className="grid grid-cols-1 lg:grid-cols-[1fr_150px_1fr] items-center gap-5">
          <div className="flex justify-center"><div className="battle-card"><div className="text-[9px] uppercase tracking-[.25em] text-emerald-300/60 text-center mb-2">{t.chooseHero}</div>{p?<CardVisual card={p} t={t} showAssetLabel/>:<div className="lux-panel rounded-[26px] h-[470px] grid place-items-center text-slate-700">{t.chooseHero}</div>}</div></div>
          <div className="flex justify-center"><div className="vs-orb font-cinzel text-2xl text-white/30">VS</div></div>
          <div className="flex justify-center"><div className="battle-card"><div className="text-[9px] uppercase tracking-[.25em] text-red-300/60 text-center mb-2">{game.opponentName||t.waiting}</div>{o?<CardVisual card={o} t={t} enemy showAssetLabel/>:<div className="lux-panel rounded-[26px] h-[470px] grid place-items-center text-slate-700">{t.waiting}</div>}</div></div>
        </div>

        <div className="combat-hud-grid max-w-6xl mx-auto mt-5">
          <CombatStatPanel side="player" card={p} hp={game.playerHP} maxHp={game.maxPlayerHP} energy={game.playerEnergy} t={t}/>
          <div className="combat-core-stat">
            <div className="combat-core-ring"><span>ROUND</span><strong>{game.round}</strong><small>2 WINS TO END</small></div>
          </div>
          <CombatStatPanel side="enemy" card={o} hp={game.opponentHP} maxHp={game.maxOpponentHP} energy={game.opponentEnergy} t={t}/>
        </div>

        {game.stage==="CARD_SELECT"&&<div className="lux-panel rounded-[24px] p-4 mt-5"><div className="text-center text-[10px] uppercase tracking-[.28em] text-slate-500 mb-3">{t.chooseHero}</div><div className="grid grid-cols-3 gap-3">{squad.filter(Boolean).map(id=>{const c=getCard(id);return <button key={id} onClick={()=>handleSelectHero(id)} className={`lux-panel rounded-2xl p-3 border ${rarityClass(c.rarity)} hover:-translate-y-1 transition`}><div className="text-4xl">{c.avatar}</div><div className="text-[10px] font-bold mt-2 truncate">{c.name}</div><div className="text-[8px] uppercase tracking-widest text-slate-500 mt-1">{rarityText(c.rarity,t)}</div></button>})}</div></div>}

        {game.stage==="ABILITY_SPLIT"&&p&&<div className="lux-panel rounded-[24px] p-4 mt-5"><div className="text-center text-[10px] uppercase tracking-[.28em] text-slate-500 mb-3">{t.chooseAbility}</div><div className="grid grid-cols-2 md:grid-cols-4 gap-3">{abilities.map((ab,i)=><AbilityButton key={ab.id} ab={ab} index={i} energy={game.playerEnergy} disabled={ab.isUlt&&game.playerEnergy<100} selected={game.selectedAbility?.id===ab.id} onClick={()=>handleSelectAbility(ab)} t={t}/>)}</div></div>}
        {game.stage==="RESOLVING"&&<div className="text-center mt-7 text-[10px] uppercase tracking-[.35em] text-slate-500 animate-pulse">{t.waiting}</div>}

        {bossMode&&game.raidMembers?.length>0&&<div className="mt-5 grid grid-cols-2 md:grid-cols-3 gap-2">{game.raidMembers.map(m=><div key={m.peerId} className="lux-panel rounded-xl p-3"><div className="text-[9px] text-slate-500 uppercase">{m.name}</div><div className="font-semibold text-xs mt-1">{mergePhase?m.card?.name:"HIDDEN CARD"}</div><div className="text-[8px] text-slate-500 mt-1">HP {Math.round(m.hp||0)}</div></div>)}</div>}
      </div>

      {mergePhase&&p&&o&&<div className={`merge-scene ${mergePhase==="active"?"active":""} ${mergePhase==="flash"||mergePhase==="result"?"active flash":""} ${mergePhase==="result"?"show-result":""}`}>
        <div className="merge-flash-boom"/>
        <div className="merge-core">
          <div className="merge-fusion-orb"/><div className="merge-fusion-ring"/>
          <div className="merge-card left clash-player-anim"><div className="merge-card-inner"><div className="merge-card-label">YOU</div><div className="text-6xl relative z-10">{p.avatar}</div><div className="font-cinzel mt-4 relative z-10">{p.name}</div></div></div>
          <div className="merge-card right clash-opponent-anim"><div className="merge-card-inner"><div className="merge-card-label">OPPONENT</div><div className="text-6xl relative z-10">{o.avatar}</div><div className="font-cinzel mt-4 relative z-10">{o.name}</div></div></div>
          <div className="merge-white"><div className="merge-winner"><div className="merge-fused-icons">{result?.roundWinner==="PLAYER"?p.avatar:result?.roundWinner==="OPPONENT"?o.avatar:"✦"}</div>{mergePhase==="result"&&<><small>{t.round} {game.round}</small><strong>{result?.roundWinner==="PLAYER"?t.roundWin:result?.roundWinner==="OPPONENT"?t.roundLose:t.draw}</strong><em>{result?.roundWinner==="PLAYER"?p.name:result?.roundWinner==="OPPONENT"?o.name:`${p.name} • ${o.name}`}</em></>}</div></div>
        </div>
        {mergePhase==="result"&&<div className={`merge-fusion-glow ${result?.roundWinner==="PLAYER"?"glow-win":result?.roundWinner==="OPPONENT"?"glow-loss":"glow-draw"}`}>{result?.roundWinner==="PLAYER"?t.roundWin:result?.roundWinner==="OPPONENT"?t.roundLose:t.draw}</div>}
      </div>}

      {game.stage==="ROUND_RESULT"&&result&&<div className="modal-backdrop"><div className="modal-card lux-panel p-6 sm:p-9 text-center pop-in"><div className="text-[9px] uppercase tracking-[.35em] text-slate-500">{t.round} {game.round}</div><h2 className={`font-cinzel text-4xl mt-3 ${result.roundWinner==="PLAYER"?"text-emerald-300":result.roundWinner==="OPPONENT"?"text-red-300":"text-white"}`}>{result.roundWinner==="PLAYER"?t.roundWin:result.roundWinner==="OPPONENT"?t.roundLose:t.draw}</h2><div className="grid grid-cols-2 gap-3 mt-7"><div className="rounded-2xl border border-emerald-400/15 bg-emerald-400/5 p-4"><div className="text-[9px] text-emerald-300/70 uppercase">{t.yourDamage}</div><div className="font-cinzel text-3xl mt-1">{result.pDmg}</div>{result.oBlocked&&<div className="text-[9px] text-red-300 mt-2">{t.blocked}</div>}</div><div className="rounded-2xl border border-red-400/15 bg-red-400/5 p-4"><div className="text-[9px] text-red-300/70 uppercase">{t.enemyDamage}</div><div className="font-cinzel text-3xl mt-1">{result.oDmg}</div>{result.pBlocked&&<div className="text-[9px] text-red-300 mt-2">{t.blocked}</div>}</div></div><button onClick={handleNextRound} className="lux-btn neon w-full rounded-xl py-3 mt-6 font-bold text-sm">{t.nextRound}</button></div></div>}

      {over&&<div className="modal-backdrop"><div className="modal-card lux-panel p-7 sm:p-10 text-center pop-in"><div className="text-7xl">{winner==="PLAYER"?"👑":"💀"}</div><div className={`font-cinzel text-5xl mt-4 ${winner==="PLAYER"?"text-emerald-300":"text-red-300"}`}>{winner==="PLAYER"?t.victory:t.defeat}</div><div className="text-slate-500 text-xs uppercase tracking-[.3em] mt-3">{game.endReason||"MATCH COMPLETE"}</div><div className="mt-7 rounded-2xl border border-white/8 bg-black/20 p-5"><div className="text-yellow-300 font-bold">{game.battleMode==="raid"&&winner==="PLAYER"?BOSS_REWARD:game.battleMode==="pvp"?PVP_REWARD:PVE_REWARD} 💰</div>{game.battleMode==="raid"&&winner==="PLAYER"&&<div className="text-emerald-300 text-xs mt-2">{t.bossCard}</div>}</div><button onClick={()=>{
        if(winner==="PLAYER"){
          if(game.battleMode==="raid"){setCoins(c=>c+BOSS_REWARD);const drop=weightedRarityDrop(ben10Cards);if(!unlocked.includes(drop.id))setUnlocked(u=>[...u,drop.id]);}
          else if(game.battleMode==="pvp")setCoins(c=>c+PVP_REWARD);else setCoins(c=>c+PVE_REWARD);
        }
        setMergePhase(null);closeToMenu();audio.click();
      }} className="lux-btn neon w-full rounded-xl py-3 mt-6 font-bold text-sm">{t.mainMenu}</button></div></div>}
    </div>
  };

  const renderModals=()=><>
    {pauseOpen&&<div className="modal-backdrop"><div className="modal-card lux-panel p-6 sm:p-8 max-w-sm"><div className="font-cinzel text-3xl">{t.pause}</div>{game?.battleMode!=="pve"&&<div className="mt-5 rounded-2xl bg-red-500/5 border border-red-400/15 p-4"><div className="text-3xl font-cinzel text-red-300">{pauseLeft}s</div><div className="text-xs text-slate-400 mt-2 leading-relaxed">{t.pauseWarn}</div></div>}<div className="grid gap-3 mt-6"><button onClick={()=>{setPauseOpen(false);audio.click()}} className="lux-btn neon rounded-xl py-3 font-bold text-sm">{t.resume}</button><button onClick={()=>setConfirmExit(true)} className="lux-btn red rounded-xl py-3 font-bold text-sm">{t.exit}</button></div></div></div>}
    {confirmExit&&<div className="modal-backdrop" style={{zIndex:150}}><div className="modal-card lux-panel p-7 max-w-md text-center"><div className="text-5xl">⚠️</div><div className="font-cinzel text-2xl mt-4">{t.surrenderConfirm}</div><div className="text-sm text-slate-400 mt-3">{game?.battleMode==="pve"?t.pveSurrender:t.onlineSurrender}</div><div className="flex gap-3 mt-7"><button onClick={()=>setConfirmExit(false)} className="lux-btn rounded-xl py-3 flex-1 text-sm font-bold">{t.cancel}</button><button onClick={confirmLeave} className="lux-btn red rounded-xl py-3 flex-1 text-sm font-bold">{t.confirm}</button></div></div></div>}
    {showCredits&&<div className="modal-backdrop" onClick={()=>setShowCredits(false)}><div className="modal-card lux-panel p-8 max-w-md text-center" onClick={e=>e.stopPropagation()}><button onClick={()=>setShowCredits(false)} className="absolute"/> <div className="text-6xl">👨‍💻</div><div className="font-cinzel text-3xl mt-4">CREDITS</div><div className="text-sm text-slate-300 mt-3">{t.author}</div><div className="text-xs text-slate-500 mt-2">Game Design • UI • Logic • Asset Slots</div><a href="https://t.me/dieg0Ae" target="_blank" rel="noreferrer" className="lux-btn neon rounded-xl py-3 mt-7 block text-xs font-bold">{t.telegram}</a></div></div>}
    {showHelp&&<div className="modal-backdrop" onClick={()=>setShowHelp(false)}><div className="modal-card lux-panel p-7 sm:p-9" onClick={e=>e.stopPropagation()}><div className="font-cinzel text-3xl">{t.helpTitle}</div><div className="space-y-5 mt-6 text-sm leading-relaxed text-slate-300"><p>{t.helpIntro}</p><div><div className="text-[10px] uppercase tracking-[.25em] text-emerald-300/70">Combat</div><p className="mt-2">{t.helpCombat}</p></div><div><div className="text-[10px] uppercase tracking-[.25em] text-cyan-300/70">Energy</div><p className="mt-2">{t.helpEnergy}</p></div><div><div className="text-[10px] uppercase tracking-[.25em] text-red-300/70">Online</div><p className="mt-2">{t.helpOnline}</p></div><div><div className="text-[10px] uppercase tracking-[.25em] text-yellow-300/70">Boss</div><p className="mt-2">{t.helpBoss}</p></div><div><div className="text-[10px] uppercase tracking-[.25em] text-emerald-300/70">Creator</div><p className="mt-2">{t.helpCreator}</p></div><a href="https://t.me/dieg0Ae" target="_blank" rel="noreferrer" className="lux-btn neon rounded-xl py-3 block text-center font-bold text-sm">{t.support}</a></div></div></div>}
  </>;

  return <div className="app-shell">
    <div className="grain"/>
    <div className="ambient-root"><div className="aurora"/>{fogs.map(f=><div key={f.i} className="fog" style={{left:f.left+"%",top:f.top+"%",width:f.size,height:f.size,animationDuration:f.duration+"s",animationDelay:f.delay+"s"}}/>)}{particles.map(p=><div key={p.i} className="particle" style={{left:p.left+"%",width:p.size,height:p.size,animationDuration:p.dur+"s",animationDelay:p.delay+"s",["--dx"]:p.dx+"px"}}/> )}</div>

    {screenState==="main"&&renderMain()}
    {screenState==="online"&&renderOnline()}
    {screenState==="bossSelect"&&renderBossSelect()}
    {screenState==="deck"&&renderDeck()}
    {screenState==="shop"&&renderShop()}
    {screenState==="collection"&&renderCollection()}
    {screenState==="settings"&&renderSettings()}
    {screenState==="battle"&&renderBattle()}
    {renderModals()}

    {toast&&<div className="fixed left-1/2 -translate-x-1/2 bottom-6 z-[200] px-4 py-3 rounded-2xl lux-panel text-xs font-bold border border-emerald-400/20 bg-black/40 backdrop-blur-xl">{toast}</div>}
  </div>
}

class OmniClashErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={hasError:false,error:null}}
  static getDerivedStateFromError(error){return {hasError:true,error}}
  componentDidCatch(error,info){console.error("OMNI CLASH RENDER ERROR",error,info)}
  reset=()=>{try{sessionStorage.setItem("omni_recover","1");location.reload()}catch(e){location.reload()}}
  render(){
    if(this.state.hasError){
      return <div style={{minHeight:"100vh",display:"grid",placeItems:"center",background:"radial-gradient(circle at center,#0d1811,#020402 70%)",color:"white",fontFamily:"Inter,system-ui,sans-serif",padding:"24px"}}>
        <div style={{width:"min(520px,94vw)",padding:"32px",border:"1px solid rgba(255,255,255,.12)",borderRadius:"28px",background:"rgba(8,14,10,.82)",backdropFilter:"blur(20px)",boxShadow:"0 30px 100px rgba(0,0,0,.55)",textAlign:"center"}}>
          <div style={{fontSize:"48px"}}>✦</div>
          <div style={{fontFamily:"Orbitron,sans-serif",fontSize:"25px",fontWeight:800,letterSpacing:".08em",marginTop:"14px"}}>OMNI CLASH</div>
          <div style={{fontSize:"13px",color:"#94a3b8",marginTop:"10px",lineHeight:1.6}}>Произошла ошибка отображения. Данные матча сохранены, приложение можно безопасно перезапустить.</div>
          <button onClick={this.reset} style={{marginTop:"22px",width:"100%",padding:"13px 18px",borderRadius:"14px",border:"1px solid rgba(0,255,102,.35)",background:"rgba(0,255,102,.1)",color:"#b7ffd4",fontWeight:800,cursor:"pointer"}}>ПЕРЕЗАПУСТИТЬ ИГРУ</button>
          <div style={{fontSize:"9px",color:"#475569",marginTop:"14px",wordBreak:"break-word"}}>{String(this.state.error?.message||"").slice(0,180)}</div>
        </div>
      </div>
    }
    return this.props.children;
  }
}

window.addEventListener("error",e=>{console.error("OMNI CLASH GLOBAL ERROR",e.error||e.message)});
window.addEventListener("unhandledrejection",e=>{console.error("OMNI CLASH PROMISE ERROR",e.reason)});

ReactDOM.createRoot(document.getElementById("root")).render(<OmniClashErrorBoundary><OmniClashApp/></OmniClashErrorBoundary>);
</script>
</body>
</html>
